version: '3.8'

services:
  nexus:
    build: .
    container_name: nexus-core
    ports:
      - "8000:8000"
    environment:
      - NEXUS_LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o
      # Se preferir Anthropic, comente o acima e descomente o abaixo:
      # - NEXUS_LLM_PROVIDER=anthropic
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - ANTHROPIC_MODEL=claude-3-opus-20240229
    volumes:
      # Persiste o banco de dados SQLite
      - nexus_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nexus_data:
